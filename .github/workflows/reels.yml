# SINAV OTURUMU REELS — günlük yayın (docs/meta-reels-plani.md Faz 5). Depo: tools/reels/reels_depo.py ile gönderilir.
# Her gün 11:30 ve 18:30 (TSİ; önce kanal ölçümü) + panelde sınav oturumu değişince (repository_dispatch 'oturum') + elle.
# Üç platform AYRI işte, AYNI ANDA (kullanıcı 04.11.2026 "darboğaza sokmasın"): biri sınıra ya da hataya takılırsa öbürleri sürer.
# Sınırlar: Instagram 100 / 24 sa · Facebook 30 / 24 sa · YouTube yükleme kotası günde 100 (insert ayrı kovada 1 birim; silme/güncelleme ortak 10.000 biriminden 50). Defter platform başına atomik yazılır (PATCH).
name: Reels
on:
  schedule:
    - cron: '30 8 * * *'   # 11:30 TSİ — YouTube kotası Pasifik gece yarısı (11:00 TSİ) sıfırlanır
    - cron: '30 15 * * *'  # 18:30 TSİ — süre tavanına takılan Instagram kuyruğu aynı gün biter
  repository_dispatch:
    types: [oturum]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (ig, fb, yt, hikaye ya da hepsi)'
        default: 'hepsi'
concurrency:
  group: reels
  cancel-in-progress: false
jobs:
  # KANAL İSTATİSTİK ÖLÇÜMÜ (11.11.2026, kullanıcı "HER SAAT GEREK VAR MI · GÜNDE 2 KEZ"): her zamanlanmış yayından HEMEN ÖNCE, tek kez.
  # Kayıt sabit dilime yazılır (11:30 koşusu → 11:00, 18:30 koşusu → 18:00 TSİ); oturum değişikliği tetiği ve elle yayın ölçüm yapmaz.
  # Ölçüm başarısız olsa da yayın sürer (yayin 'needs' + !cancelled()). Eski saatlik kanal.yml yalnız elle çalışır.
  kanal:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install requests google-api-python-client google-auth
      - name: Kanal ölçümü
        env:
          META_SOSYAL_TOKEN: ${{ secrets.META_SOSYAL_TOKEN }}
          META_IG_HESAP: ${{ secrets.META_IG_HESAP }}
          META_FB_SAYFA: ${{ secrets.META_FB_SAYFA }}
          REELS_ANAHTAR: ${{ secrets.REELS_ANAHTAR }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          PYTHONIOENCODING: utf-8
        run: python tools/reels/kanal_saatlik.py --dilim ${{ github.event.schedule == '30 8 * * *' && '11' || '18' }}
  yayin:
    needs: kanal
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ig, en_cok: 100 }
          - { platform: fb, en_cok: 30 }
          - { platform: yt, en_cok: 100 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: |
          pip install requests playwright imageio-ffmpeg google-api-python-client google-auth
          python -m playwright install --with-deps chromium
      - name: Yayın ${{ matrix.platform }}
        env:
          META_SOSYAL_TOKEN: ${{ secrets.META_SOSYAL_TOKEN }}
          META_IG_HESAP: ${{ secrets.META_IG_HESAP }}
          META_FB_SAYFA: ${{ secrets.META_FB_SAYFA }}
          REELS_ANAHTAR: ${{ secrets.REELS_ANAHTAR }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          REELS_KAYNAK: ${{ github.workspace }}/kaynak
          PYTHONIOENCODING: utf-8
        # elle başlatmada yalnız seçilen platform (varsayılan hepsi)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'hepsi' || github.event.inputs.platform == matrix.platform
        run: python tools/reels/reels_yayin.py --uygula --platform ${{ matrix.platform }} --en-cok ${{ matrix.en_cok }} --sure-dk 330
  # FACEBOOK HİKÂYELERİ (08.11.2026, kullanıcı "ilk hafta günde 8"): günde BİR kez (11:30 zamanlaması) ya da elle 'hikaye'; oturum değişikliği
  # (repository_dispatch) ve 18:30 tetiklemez — hikâye 24 saat yaşar, aynı gün ikinci tur aynı satırları yinelerdi. tools/reels/hikaye.py
  hikaye:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 8 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'hikaye')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: |
          pip install requests playwright imageio-ffmpeg google-api-python-client google-auth
          python -m playwright install --with-deps chromium
      - name: Hikâye
        env:
          META_SOSYAL_TOKEN: ${{ secrets.META_SOSYAL_TOKEN }}
          META_IG_HESAP: ${{ secrets.META_IG_HESAP }}
          META_FB_SAYFA: ${{ secrets.META_FB_SAYFA }}
          REELS_ANAHTAR: ${{ secrets.REELS_ANAHTAR }}
          REELS_KAYNAK: ${{ github.workspace }}/kaynak
          PYTHONIOENCODING: utf-8
        run: python tools/reels/hikaye.py --uygula --adet 8 --platform hepsi | tee -a "$GITHUB_STEP_SUMMARY"
  # Günlük toplam istatistik (kullanıcı 05.11.2026): yayın işleri bitince (başarısız olsa da) FB/IG/YT toplamları sunucuya yazılır.
  istatistik:
    needs: yayin
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install requests google-api-python-client google-auth
      - name: İstatistik
        env:
          META_SOSYAL_TOKEN: ${{ secrets.META_SOSYAL_TOKEN }}
          META_IG_HESAP: ${{ secrets.META_IG_HESAP }}
          META_FB_SAYFA: ${{ secrets.META_FB_SAYFA }}
          REELS_ANAHTAR: ${{ secrets.REELS_ANAHTAR }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          PYTHONIOENCODING: utf-8
        run: python tools/reels/reels_istatistik.py

  # 06.11.2026 (kullanıcı "GITHUB ACTIONS YAPAMIYOR MUSUN"): ziyaret kaynağı etiketi — yayından SONRA YouTube + Facebook açıklamalarındaki
  # etiketsiz adenbelge bağlantılarını etiketler, geri okur, KALAN sayısını yazar. İdempotent; kota/sınırda durur, ertesi koşu tamamlar.
  etiket:
    needs: yayin
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install requests google-api-python-client google-auth
      - name: Etiket
        env:
          META_SOSYAL_TOKEN: ${{ secrets.META_SOSYAL_TOKEN }}
          META_IG_HESAP: ${{ secrets.META_IG_HESAP }}
          META_FB_SAYFA: ${{ secrets.META_FB_SAYFA }}
          REELS_ANAHTAR: ${{ secrets.REELS_ANAHTAR }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          PYTHONIOENCODING: utf-8
        run: python tools/reels/reels_etiket.py --uygula | tee -a "$GITHUB_STEP_SUMMARY"
